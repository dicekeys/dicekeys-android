plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.dicekeys.app"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 15
        versionName "1.15"

        testApplicationId "com.dicekeys.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain 17
    }

    testOptions {
        unitTests {
            includeAndroidResources true
            returnDefaultValues true
        }
    }

    lint {
        abortOnError false
    }

    namespace 'org.dicekeys.app'
    buildToolsVersion buildToolsVersion
}

dependencies {
    implementation project(':dicekey')
    implementation project(':api')

    implementation "com.github.dicekeys:read-dicekey-android:$read_dicekey"
    implementation "com.github.dicekeys:seeded-crypto-android:$seeded_crypto"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:$kotlinx_serialization_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.6.0'

    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.browser:browser:1.8.0"

    implementation "androidx.camera:camera-camera2:1.5.0"
    implementation "androidx.camera:camera-view:1.5.0"
    implementation "androidx.camera:camera-lifecycle:1.5.0"
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'

    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
    testImplementation "androidx.navigation:navigation-testing:$navigation_version"
    androidTestImplementation "androidx.navigation:navigation-testing:$navigation_version"

    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"

    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptTest "com.google.dagger:hilt-android-compiler:$hilt_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.test.ext:junit-ktx:1.3.0"
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
