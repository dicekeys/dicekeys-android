plugins {
    id("com.android.application") version "8.13.0" apply false
    id("com.android.library") version "8.13.0" apply false
    id("org.jetbrains.kotlin.android") version "2.2.0" apply false
    id("org.jetbrains.kotlin.plugin.parcelize") version "2.2.0" apply false
    id("org.jetbrains.kotlin.plugin.serialization") version "2.2.0" apply false
    id("com.google.dagger.hilt.android") version "2.57" apply false
    id("androidx.navigation.safeargs.kotlin") version "2.9.4" apply false
    id("org.jetbrains.dokka") version "1.9.20" apply false
}

ext {
    kotlinx_coroutines_version = "1.8.1"
    kotlinx_serialization_version = "1.7.3"
    core_ktx_version = "1.17.0"
    seeded_crypto = "0.0.2"
    read_dicekey = "0.0.5"
    hilt_version = "2.57"
}


import org.jetbrains.dokka.gradle.DokkaTask

tasks.register("dokkaHtmlAll", DokkaTask) {
    outputDirectory.set(buildDir.resolve("dokka"))
    dokkaSourceSets.configureEach {
        includeNonPublic.set(false)
        samples.from("api/src/sample")
        includes.from("packages.md", "extra.md")
        jdkVersion.set(8)
        externalDocumentationLink { url.set(URL("https://developer.android.com/reference/androidx/")) }
        externalDocumentationLink { url.set(URL("https://developer.android.com/reference/")) }
    }
}

tasks.register("dokkaMarkdown", DokkaTask) {
    outputDirectory.set(file("docs"))
    dokkaSourceSets.configureEach {
        includeNonPublic.set(false)
        samples.from("api/src/sample")
        includes.from("packages.md", "extra.md")
        jdkVersion.set(8)
        externalDocumentationLink { url.set(URL("https://developer.android.com/reference/androidx/")) }
        externalDocumentationLink { url.set(URL("https://developer.android.com/reference/")) }
    }
}

tasks.register("clean", Delete) {
    delete(rootProject.buildDir)
}
